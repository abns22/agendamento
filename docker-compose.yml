version: '3.8'

services:
  # Serviço de Banco de Dados PostgreSQL
  db:
    image: postgres:16
    container_name: synkhro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agendamento_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendamento_password}
      POSTGRES_DB: ${POSTGRES_DB:-agendamento_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persistência de dados do PostgreSQL
      - postgres_data:/var/lib/postgresql/data
      # Scripts de inicialização (opcional)
      - ./backend/scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agendamento_user} -d ${POSTGRES_DB:-agendamento_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serviço Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synkhro-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agendamento_user}:${POSTGRES_PASSWORD:-agendamento_password}@db:5432/${POSTGRES_DB:-agendamento_db}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      
      # Stripe (opcional)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      
      # WhatsApp (opcional)
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      
      # CORS - Permitir requisições do frontend
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
      
      # File Uploads
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5242880}
    volumes:
      # Persistência de uploads
      - backend_uploads:/app/uploads
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Serviço Frontend (React/Vite com Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synkhro-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # Variáveis de ambiente do frontend (se necessário)
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    networks:
      - app-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Volumes nomeados para persistência de dados
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

# Rede para comunicação entre serviços
networks:
  app-network:
    driver: bridge

