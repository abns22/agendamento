services:
  # Backend FastAPI
  - type: web
    name: agendamento-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: agendamento-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: '["https://agendamento-frontend-mpzb.onrender.com", "http://localhost:3000", "http://localhost:5173", "http://127.0.0.1:8000"]'

  # Frontend React/Vite
  - type: web
    name: agendamento-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        # Domínio do Backend sem barra final - o Frontend adiciona /api/v1 no código
        value: https://agendamento-backend-v592.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # PostgreSQL Database (Sintaxe Mínima)
  - name: agendamento-postgres
    databaseName: agendamento_db
    user: agendamento_user
    region: oregon
    ipAllowList: []

