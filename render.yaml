services:
  # Backend FastAPI
  - type: web
    name: agendamento-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: agendamento-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        value: '["https://agendamento-frontend.onrender.com"]'

  # Frontend React/Vite
  - type: web
    name: agendamento-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://agendamento-backend.onrender.com

databases:
  # PostgreSQL Database (Sintaxe Mínima)
  - name: agendamento-postgres
    databaseName: agendamento_db
    user: agendamento_user
    region: oregon
    ipAllowList: []

